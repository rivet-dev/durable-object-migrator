</defs>
<rect x="32" y="98" width="150" height="44" rx="7" fill="#161B22" stroke="#E6EDF3" stroke-width="1.4"/><text class="m" x="48" y="125.0" font-size="13" text-anchor="start" >/rooms/lobby</text>
