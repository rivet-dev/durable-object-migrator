<rect x="248" y="164" width="218" height="44" rx="7" fill="#161B22" stroke="#E6EDF3" stroke-width="1.4"/>
<circle cx="270" cy="186" r="11" fill="#161B22" stroke="#E6EDF3" stroke-width="1.4"/>
<text class="s b" x="270" y="190" font-size="12" text-anchor="middle" >3</text>
<text class="m" x="290" y="191" font-size="13" text-anchor="start" >next()</text>
